version: 2

builds:
  - main: ./cmd/opentree
    binary: opentree
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # LICENSE and NOTICE ride along. goreleaser includes README and LICENSE by
  # default, but naming the set turns that default off, so both are listed:
  # NOTICE names third-party marks the binary renders, and it has to reach
  # whoever received the binary rather than only whoever cloned the repository.
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE

brews:
  # A tap formula has no notion of a prerelease channel: whatever is in it is
  # what `brew install opentree` gets. "auto" leaves the tap alone when the tag
  # carries a prerelease suffix, so a v1.2.0-rc.1 does not become everyone's
  # opentree. npm-publish.sh makes the same distinction with its dist-tag.
  - skip_upload: "auto"
    repository:
      owner: axelgar
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/axelgar/opentree"
    description: "Git worktree manager CLI"
    install: |
      bin.install "opentree"
